name: Daily DVP -> Shopify Sync

on:
  schedule:
    # Runs at 05:00 UTC every day - adjust to whenever suits (avoid DVP's
    # likely peak traffic hours as a courtesy, and avoid your own peak
    # storefront traffic hours since prices/stock will be changing).
    - cron: "0 5 * * *"
  workflow_dispatch: {} # lets you also trigger it manually from the Actions tab

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Run sync
        env:
          SHOPIFY_STORE_DOMAIN: ${{ secrets.SHOPIFY_STORE_DOMAIN }}
          SHOPIFY_ADMIN_API_TOKEN: ${{ secrets.SHOPIFY_ADMIN_API_TOKEN }}
        run: node daily-sync/sync.mjs
