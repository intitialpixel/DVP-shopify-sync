name: Daily DVP -> Shopify Sync

on:
  # Daily schedule disabled: this script prices from cost and does not match the
  # supplier pricing rules now held in Shopify. Re-enable only after reworking it.
  # schedule:
  #   - cron: "0 5 * * *"
  workflow_dispatch: {} # manual trigger from the Actions tab only

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Run sync
        env:
          SHOPIFY_SHOP: ${{ secrets.SHOPIFY_SHOP }}
          SHOPIFY_CLIENT_ID: ${{ secrets.SHOPIFY_CLIENT_ID }}
          SHOPIFY_CLIENT_SECRET: ${{ secrets.SHOPIFY_CLIENT_SECRET }}
        run: node daily-sync/sync.mjs
